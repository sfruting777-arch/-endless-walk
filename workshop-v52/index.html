// Custom clips, relative to the imported bind pose.
function makeIdle(model){
 const bones=new Map();model.traverse(o=>{if(o.isBone)bones.set(o.name,o)});

let groundBase=0, groundMeshes=[]; const groundVertex=new THREE.Vector3();
const normBone=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'');
let pawGroups=[], adjusted=[];
function restorePaws(){for(const a of adjusted)a.b.position.copy(a.p);adjusted=[]}
function setupPaws(model){

  const candidates=limb==='rear'?[limb+'foot'+side,limb+'toe'+side]:[limb+'toe'+side,limb+'foot'+side,limb+'horselink'+side];
  const b=candidates.map(n=>bones.find(x=>normBone(x.name)===n)).find(Boolean);if(!b)continue;

let loadGeneration=0; function loadFile(file){

  status.textContent=idle?(walk?'✅ Покой и ходьба готовы':'⚠ Кости лап не найдены — см. Данные'):'✅ Модель загружена. Осматривай со всех сторон!'; if(idle&&mixer){playing=true;mixer.clipAction(idle).play();document.getElementById('anim').textContent='⏸ Анимация';}

}

document.getElementById('file').addEventListener('change',e=>loadFile(e.target.files?.[0]));
document.getElementById('reset').onclick=resetCamera;
document.getElementById('turn').onclick=()=>{turning=!turning;document.getElementById('turn').textContent=turning?'⏹ Автовращение':'🔄 Автовращение';controls.autoRotate=turning;controls.autoRotateSpeed=1.8};
document.getElementById('wire').onclick=()=>{showWire=!showWire;current?.traverse(x=>{if(x.isMesh){for(const m of(Array.isArray(x.material)?x.material:[x.material]))if(m)m.wireframe=showWire}});document.getElementById('wire').textContent=showWire?'◈ Обычный вид':'◈ Сетка'};
document.getElementById('anim').onclick=()=>{if(!mixer)return;playing=!playing;if(playing){mixer.stopAllAction();mixer.clipAction(clips[Number(document.getElementById('clip').value)||0]).reset().play()}else mixer.stopAllAction();document.getElementById('anim').textContent=playing?'⏸ Анимация':'▶ Анимация'};
document.getElementById('infoBtn').onclick=()=>stats.style.display=stats.style.display==='block'?'none':'block';
let night=false;document.getElementById('lightBtn').onclick=()=>{night=!night;scene.background.set(night?0x141c30:0x253635);key.intensity=night?.65:3.1;rim.intensity=night?2:1.35;renderer.toneMappingExposure=night?.85:1.55};
let floor=true;document.getElementById('gridBtn').onclick=()=>{floor=!floor;ground.visible=grid.visible=floor};
let bottom=false;document.getElementById('bottomBtn').onclick=()=>{bottom=!bottom;ground.visible=grid.visible=!bottom;floor=!bottom;camera.position.set(0,centerY+(bottom?-camRadius:camRadius),.01);controls.update()};
document.getElementById('clip').onchange=()=>{if(playing&&mixer){mixer.stopAllAction();mixer.clipAction(clips[Number(document.getElementById('clip').value)]).reset().play()}};
const drop=document.getElementById('drop');window.addEventListener('dragover',e=>{e.preventDefault();drop.style.display='grid'});drop.addEventListener('dragleave',e=>{e.preventDefault();drop.style.display='none'});window.addEventListener('drop',e=>{e.preventDefault();drop.style.display='none';loadFile(e.dataTransfer?.files?.[0])});
addEventListener('resize',fitViewport);new ResizeObserver(fitViewport).observe(document.querySelector('.controls'));
document.getElementById('walkBtn').onclick=()=>{if(!mixer||!clips[1]||!clips[1].name.startsWith('Ходьба'))return;const sel=document.getElementById('clip');sel.value=sel.value==='1'?'0':'1';mixer.stopAllAction();mixer.clipAction(clips[Number(sel.value)]).reset().play();playing=true;document.getElementById('anim').textContent='⏸ Анимация';};
document.getElementById('stride').oninput=()=>{document.getElementById('strideValue').textContent=Number(document.getElementById('stride').value).toFixed(1)};
document.getElementById('stride').onchange=()=>{if(!mixer||!clips[1]?.name.startsWith('Ходьба'))return;const sel=document.getElementById('clip'),wasPlaying=playing;restorePaws();mixer.stopAllAction();mixer.uncacheClip(clips[1]);current.updateMatrixWorld(true);clips[1]=makeWalk(current,Number(document.getElementById('stride').value));if(wasPlaying)mixer.clipAction(clips[Number(sel.value)]).reset().play();};
const menuToggle=document.getElementById('menuToggle');
menuToggle.onclick=()=>{const hidden=document.body.classList.toggle('menu-hidden');menuToggle.textContent=hidden?'◇':'◆';menuToggle.setAttribute('aria-expanded',String(!hidden));menuToggle.setAttribute('aria-label',hidden?'Показать настройки':'Скрыть настройки');fitViewport()};
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);restorePaws();if(playing)mixer?.update(dt*Number(document.getElementById('speed').value));if(current){current.position.y=groundBase;if(playing&&clips[Number(document.getElementById('clip').value)]?.name.startsWith('Ходьба'))correctPaws()}controls.update();renderer.render(scene,camera)}animate();loadFile(rigPreset);
</script></body></html>
