<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Мастерская хозяина H1</title><style>*{box-sizing:border-box}html,body{margin:0;position:fixed;inset:0;overflow:hidden;touch-action:none;background:#829e91;color:white;font:14px system-ui}canvas{display:block;touch-action:none}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;background:#203c36d9;border-radius:12px;padding:10px;pointer-events:none}#panel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:#203c36ed;border-radius:14px;padding:8px}button{background:#395e52;border:1px solid #d1c5a4;color:white;font:600 13px system-ui;border-radius:9px;padding:9px;min-height:38px}label{display:flex;align-items:center;gap:4px}input{width:80px}#toggle{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px)}#panel[hidden]{display:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="hud"><b>Хозяин · H1</b><div id="status">Загрузка модели…</div><div id="fps">FPS —</div></div><button id="toggle">◆</button><div id="panel"><button id="idle">Покой</button><button id="walk">Ходьба</button><button id="front">Спереди</button><button id="side">Сбоку</button><button id="back">Сзади</button><button id="plus">＋</button><button id="minus">−</button><label>Темп <input id="rate" type="range" min=".5" max="1.6" step=".1" value="1"></label><label>Шаг <input id="step" type="range" min=".5" max="1.5" step=".1" value="1"></label></div><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x90a89e);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.02,100),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf1f6ff,0x72634c,2.6));const light=new THREE.DirectionalLight(0xffecd7,3);light.position.set(3,6,4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);Object.assign(light.shadow.camera,{left:-4,right:4,top:4,bottom:-4});scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x728f78,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(20,40,0xc4c8a8,0x8da58b);grid.position.y=.001;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.touches.TWO=-1;controls.minDistance=.8;controls.maxDistance=10;controls.target.set(0,.9,0);camera.position.set(2,1.4,3.4);controls.update();
let model=null,bones=new Map(),rests=new Map(),axes=new Map(),phase=0,time=0,blend=0,wanted=0,forward=new THREE.Vector3(0,0,1),side=new THREE.Vector3(1,0,0),groundY=0,hipRest=null,hipUp=null,hipSide=null,modelScale=1;
const names=['Hips','Spine','Spine1','Spine2','Neck','Head','LeftArm','RightArm','LeftForeArm','RightForeArm','LeftUpLeg','RightUpLeg','LeftLeg','RightLeg','LeftFoot','RightFoot','LeftToeBase','RightToeBase'];
const q=new THREE.Quaternion();
function rotate(n,pitch=0,yaw=0,roll=0){const b=bones.get(n),a=axes.get(n);if(!b||!a)return;b.quaternion.copy(rests.get(n)).multiply(q.setFromAxisAngle(a.pitch,pitch)).multiply(q.setFromAxisAngle(a.yaw,yaw)).multiply(q.setFromAxisAngle(a.roll,roll))}
function pose(dt){if(!model)return;time+=dt;blend+=(wanted-blend)*(1-Math.exp(-dt*7));phase=(phase+dt*2*Math.PI/1.35*Number($('rate').value))%(2*Math.PI);const a=blend*Number($('step').value),s=Math.sin(phase),c=Math.cos(phase);
for(const n of names){const b=bones.get(n);if(b)b.quaternion.copy(rests.get(n))}
const breath=.009*Math.sin(time*2);
rotate('Hips',0,.035*s*a,.018*c*a);rotate('Spine',breath,-.025*s*a,-.012*c*a);rotate('Spine1',breath*.5,-.014*s*a,0);rotate('Spine2',breath*.3,0,0);rotate('Neck',0,.012*Math.sin(time*.7),0);rotate('Head',.008*Math.sin(time*1.1),-.018*s*a,0);
for(const [name,k] of [['Left',1],['Right',-1]]){const p=phase+(k===1?0:Math.PI),swing=Math.sin(p),lift=Math.max(0,Math.sin(p));
rotate(name+'UpLeg',-.27*swing*a,0,.005*k*a);rotate(name+'Leg',.36*lift*a);rotate(name+'Foot',.08*swing*a-.16*lift*a);rotate(name+'ToeBase',.06*Math.max(0,-swing)*a);
rotate(name+'Arm',.18*swing*a,0,0);rotate(name+'ForeArm',-.08-.09*Math.max(0,-swing)*a,0,0);
}
const hips=bones.get('Hips');if(hips&&hipRest){hips.position.copy(hipRest).addScaledVector(hipUp,(.008*(1-Math.cos(phase*2))*a)/modelScale).addScaledVector(hipSide,.008*c*a/modelScale)}
model.position.y=groundY;
}
function view(n){const v=n==='side'?side.clone():forward.clone().multiplyScalar(n==='back'?-1:1);camera.position.copy(controls.target).addScaledVector(v,3.4).add(new THREE.Vector3(0,.3,0));controls.update()}
new GLTFLoader().load('../animations/owner-rig-no-animations.glb',g=>{try{model=g.scene;scene.add(model);model.updateMatrixWorld(true);model.traverse(o=>{if(o.isBone){const n=o.name.split(':').pop().replace(/^mixamorig/,'');bones.set(n,o)}if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.isSkinnedMesh)o.frustumCulled=false}});const l=bones.get('LeftArm'),r=bones.get('RightArm');if(l&&r){side.copy(l.getWorldPosition(new THREE.Vector3()).sub(r.getWorldPosition(new THREE.Vector3())));side.y=0;side.normalize();forward.crossVectors(side,new THREE.Vector3(0,1,0)).normalize();const hf=bones.get('headfront'),head=bones.get('Head');if(hf&&head&&hf.getWorldPosition(new THREE.Vector3()).sub(head.getWorldPosition(new THREE.Vector3())).dot(forward)<0)forward.negate()}
const lateral=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),forward).normalize();for(const [n,b] of bones){rests.set(n,b.quaternion.clone());const inv=b.getWorldQuaternion(new THREE.Quaternion()).invert();axes.set(n,{pitch:lateral.clone().applyQuaternion(inv),yaw:new THREE.Vector3(0,1,0).applyQuaternion(inv),roll:forward.clone().applyQuaternion(inv)})}
const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());model.scale.setScalar(1.75/size.y);model.updateMatrixWorld(true);box.setFromObject(model);const center=box.getCenter(new THREE.Vector3());model.position.set(-center.x,-box.min.y,-center.z);groundY=model.position.y;model.updateMatrixWorld(true);const hips=bones.get('Hips');if(hips){hipRest=hips.position.clone();const inv=hips.parent.getWorldQuaternion(new THREE.Quaternion()).invert();hipUp=new THREE.Vector3(0,1,0).applyQuaternion(inv);hipSide=lateral.clone().applyQuaternion(inv);modelScale=hips.parent.getWorldScale(new THREE.Vector3()).y||1}
controls.target.set(0,.88,0);view('front');$('status').textContent='Скелет: '+bones.size+' · покой';}catch(e){$('status').textContent='Ошибка: '+e.message}},undefined,e=>$('status').textContent='Ошибка загрузки GLB');
$('idle').onclick=()=>{wanted=0;$('status').textContent='Покой'};$('walk').onclick=()=>{wanted=1;$('status').textContent='Ходьба H1'};for(const n of ['front','side','back'])$(n).onclick=()=>view(n);function zoom(f){const d=camera.position.clone().sub(controls.target);d.setLength(THREE.MathUtils.clamp(d.length()*f,.8,10));camera.position.copy(controls.target).add(d);controls.update()}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('toggle').onclick=()=>{$('panel').hidden=!$('panel').hidden;$('toggle').textContent=$('panel').hidden?'◇':'◆'};
const clock=new THREE.Clock();let frames=0,elapsed=0;function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();frames++;elapsed+=dt;if(elapsed>.6){$('fps').textContent='FPS '+Math.round(frames/elapsed);frames=0;elapsed=0}pose(Math.min(dt,.05));controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});for(const t of ['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
</script></body></html>
