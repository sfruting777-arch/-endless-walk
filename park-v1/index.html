<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Бесконечная прогулка · Park V1</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;touch-action:none;background:#99a9af;color:#fff;font:14px system-ui}canvas{display:block;touch-action:none}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;background:#203a32d9;padding:10px 13px;border-radius:12px;pointer-events:none}small{opacity:.8}#panel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:8px;right:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;border-radius:14px;background:#203a32e8}button{border:1px solid #bfb99e;background:#395b4d;color:#fff;padding:9px 12px;border-radius:9px;font:600 13px system-ui}#toggle{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px)}#panel[hidden]{display:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="hud"><b>Бесконечная прогулка · Park V1</b><br><small>Планировка · 44 м · <span id="fps">FPS —</span></small></div><button id="toggle">◆</button><div id="panel"><button id="overview">Общий вид</button><button id="eye">С дорожки</button><button id="walk">Обойти парк</button><button id="light">Вечер</button><button id="plus">＋</button><button id="minus">−</button></div><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0xb7c6d0);scene.fog=new T.FogExp2(0xb7c6d0,.010);
const cam=new T.PerspectiveCamera(48,innerWidth/innerHeight,.08,180),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;document.body.appendChild(r.domElement);
const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;orbit.enablePan=true;orbit.screenSpacePanning=true;orbit.touches.TWO=T.TOUCH.DOLLY_PAN;orbit.minDistance=1;orbit.maxDistance=75;orbit.maxPolarAngle=Math.PI*.49;
const hemi=new T.HemisphereLight(0xd8edff,0x66654a,2);scene.add(hemi);const sun=new T.DirectionalLight(0xffe2b2,2.6);sun.position.set(-22,35,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:80});sun.shadow.bias=-.0005;scene.add(sun);
let seed=7829;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const mat=(color,roughness=1)=>new T.MeshStandardMaterial({color,roughness});const grass=mat(0x54794a),pathmat=mat(0xbba58a),bark=mat(0x594333),wood=mat(0x79543a),metal=mat(0x333c38),stone=mat(0x777e71);const greens=[0x365a37,0x456d3e,0x577e42,0x69844a].map(c=>mat(c));
function mesh(g,m,x=0,y=0,z=0,parent=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=mesh(new T.PlaneGeometry(160,160),grass);ground.rotation.x=-Math.PI/2;ground.castShadow=false;
const ring=mesh(new T.RingGeometry(13.3,15.7,160),pathmat,0,.025,0);ring.rotation.x=-Math.PI/2;ring.castShadow=false;const entrance=mesh(new T.PlaneGeometry(2.4,8),pathmat,0,.028,19.4);entrance.rotation.x=-Math.PI/2;entrance.castShadow=false;
function branch(a,b,r1,r2,parent=scene){const av=new T.Vector3(...a),bv=new T.Vector3(...b),d=bv.clone().sub(av);const o=mesh(new T.CylinderGeometry(r2,r1,d.length(),9),bark,0,0,0,parent);o.position.copy(av.add(bv).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());return o}
const oak=new T.Group();scene.add(oak);branch([0,0,0],[.12,3.6,-.12],1.05,.66,oak);branch([.12,3.2,-.12],[-.25,6.9,.1],.69,.34,oak);const leafGeo=new T.IcosahedronGeometry(1,2);
function crown(x,y,z,sx,sy,sz,parent=oak){const o=mesh(leafGeo,greens[Math.floor(rand()*greens.length)],x,y,z,parent);o.scale.set(sx,sy,sz);o.rotation.y=rand()*6.28;return o}
for(let i=0;i<9;i++){const a=i*6.283/9+.25,dx=Math.cos(a),dz=Math.sin(a),y=3.0+rand()*2;branch([0,y,0],[dx*3.1,y+1.8,dz*3.1],.42,.19,oak);branch([dx*2.5,y+1.6,dz*2.5],[dx*5.4,y+2.7,dz*5.4],.21,.075,oak);for(let k=0;k<4;k++)crown(dx*(3.1+k*.8)+(rand()-.5)*1.8,y+2.1+rand()*1.6,dz*(3.1+k*.8)+(rand()-.5)*1.8,2.1+rand(),1.2+rand()*.7,2+rand());branch([dx*.45,.65,dz*.45],[dx*2.25,.07,dz*2.25],.35,.06,oak)}
for(let i=0;i<12;i++){let a=rand()*6.28,rr=rand()*3.5;crown(Math.cos(a)*rr,7.2+rand()*1.8,Math.sin(a)*rr,2.4,1.65,2.4)}
// Pond, offset to the right of the tree, inside the ring.
const shape=new T.Shape(),outline=[];for(let i=0;i<100;i++){const a=i/100*6.283185,radius=1+.10*Math.sin(3*a+.5)+.07*Math.cos(5*a);const x=6.7+Math.cos(a)*4.3*radius,z=3.0+Math.sin(a)*2.25*radius;outline.push([x,z]);i?shape.lineTo(x,-z):shape.moveTo(x,-z)}shape.closePath();
const watermat=new T.MeshStandardMaterial({color:0x436c76,roughness:.22,metalness:.25});const water=mesh(new T.ShapeGeometry(shape),watermat,0,.034,0);water.rotation.x=-Math.PI/2;water.castShadow=false;const rockGeo=new T.IcosahedronGeometry(1,1);
for(let i=0;i<outline.length;i+=3){const [x,z]=outline[i];const o=mesh(rockGeo,stone,x,.08,z);o.scale.set(.18+rand()*.18,.11+rand()*.14,.2+rand()*.15);o.rotation.set(rand(),rand()*6,rand())}
const benchGroup=new T.Group();scene.add(benchGroup);function bench(x,z,a){const g=new T.Group();g.position.set(x,0,z);g.rotation.y=a;benchGroup.add(g);for(let i=0;i<4;i++)mesh(new T.BoxGeometry(1.65,.09,.115),wood,0,.46,-.19+i*.13,g);for(let i=0;i<3;i++)mesh(new T.BoxGeometry(1.65,.12,.065),wood,0,.71+i*.135,-.23,g);for(const xx of [-.65,.65]){mesh(new T.BoxGeometry(.10,.46,.10),metal,xx,.23,.14,g);mesh(new T.BoxGeometry(.10,1.05,.10),metal,xx,.525,-.23,g);mesh(new T.BoxGeometry(.10,.09,.53),metal,xx,.71,0,g)}}
const lamps=[];const bulbmat=new T.MeshStandardMaterial({color:0xffdf9e,emissive:0xffb34a,emissiveIntensity:1.2});
function lamp(x,z){branch([x,0,z],[x,1.05,z],.065,.035);mesh(new T.BoxGeometry(.22,.3,.22),bulbmat,x,1.17,z);mesh(new T.ConeGeometry(.19,.16,4),metal,x,1.4,z).rotation.y=Math.PI/4;const l=new T.PointLight(0xffba6a,0,7,2);l.position.set(x,1.15,z);scene.add(l);lamps.push(l)}
for(const a of [.68,2.34,4.5]){const x=Math.cos(a)*17.1,z=Math.sin(a)*17.1;bench(x,z,a-Math.PI/2);lamp(x+Math.cos(a+.15)*.7,z+Math.sin(a+.15)*.7)}
for(let i=0;i<4;i++){const a=i*Math.PI/2+.5;const l=new T.PointLight(0xffbd73,0,11,2);l.position.set(Math.cos(a)*2.4,.4,Math.sin(a)*2.4);scene.add(l);lamps.push(l)}
// Outer woodland and planting; intentionally lightweight placeholder geometry.
for(let i=0;i<44;i++){const a=i*6.283/44+(rand()-.5)*.09,rr=20+rand()*7,x=Math.cos(a)*rr,z=Math.sin(a)*rr;const hh=4+rand()*4;branch([x,0,z],[x,hh,z],.19,.06);for(let k=0;k<3;k++)crown(x+(rand()-.5)*2,hh-.7+k*.6,z+(rand()-.5)*2,1.5+rand(),1.4+rand(),1.6+rand(),scene)}
const shrubs=new T.InstancedMesh(new T.IcosahedronGeometry(1,1),greens[1],210);const dummy=new T.Object3D();for(let i=0;i<210;i++){const a=rand()*6.28,rr=17.8+rand()*4;dummy.position.set(Math.cos(a)*rr,.24,Math.sin(a)*rr);dummy.scale.set(.45+rand()*.55,.24+rand()*.5,.45+rand()*.55);dummy.rotation.y=rand()*6;dummy.updateMatrix();shrubs.setMatrixAt(i,dummy.matrix)}shrubs.castShadow=true;shrubs.receiveShadow=true;scene.add(shrubs);
let evening=false,walking=false,angle=Math.PI/2;function overview(){walking=false;orbit.target.set(0,1.7,0);cam.position.set(26,27,34);orbit.update()}function eye(){walking=false;orbit.target.set(0,3,0);cam.position.set(0,1.72,14.5);orbit.update()}overview();
$('overview').onclick=overview;$('eye').onclick=eye;$('walk').onclick=()=>{walking=!walking;$('walk').textContent=walking?'Остановить':'Обойти парк';};r.domElement.addEventListener('pointerdown',()=>{if(walking){walking=false;$('walk').textContent='Обойти парк'}});
$('light').onclick=()=>{evening=!evening;scene.background.set(evening?0x47516e:0xb7c6d0);scene.fog.color.copy(scene.background);hemi.intensity=evening?.85:2;sun.intensity=evening?.35:2.6;for(const l of lamps)l.intensity=evening?28:0;bulbmat.emissiveIntensity=evening?3:1.2;$('light').textContent=evening?'День':'Вечер'};
function zoom(f){const d=cam.position.clone().sub(orbit.target);d.setLength(T.MathUtils.clamp(d.length()*f,1,75));cam.position.copy(orbit.target).add(d);orbit.update()}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('toggle').onclick=()=>{$('panel').hidden=!$('panel').hidden;$('toggle').textContent=$('panel').hidden?'◇':'◆'};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
const clock=new T.Clock();let elapsed=0,frames=0;function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();elapsed+=dt;frames++;if(elapsed>.6){$('fps').textContent='FPS '+Math.round(frames/elapsed);elapsed=0;frames=0}if(walking){angle+=Math.min(dt,.05)*.065;cam.position.set(14.5*Math.cos(angle),1.72,14.5*Math.sin(angle));orbit.target.set(8*Math.cos(angle+.65),2.4,8*Math.sin(angle+.65));}orbit.update();r.render(scene,cam)}animate();
</script></body></html>
