<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Ветка · сравнение V3</title><style>body{margin:0;background:#e5e8df;color:#fff;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;background:#273d33e8;padding:12px;border-radius:12px;text-align:center;z-index:2}button{padding:9px;border-radius:8px;background:#456554;color:#fff;border:1px solid #b1c0b1;margin:4px}button.active{background:#748c78}#info{font-size:13px;opacity:.9}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><b>Ветка · сравнение V3</b><div><button id="orig">Оригинал</button><button id="opt">Сжатая</button><button id="plus">＋</button><button id="minus">−</button></div><div id="info">Запуск 3D…</div></header><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0xe5e8df);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.1;document.body.appendChild(r.domElement);const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);cam.position.set(.6,1.2,2.4);const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0xa4a092,2.5));const l=new T.DirectionalLight(0xfff0da,2.5);l.position.set(2,4,3);scene.add(l);const loader=new GLTFLoader(),cache={};let current=null,request=0;
async function openModel(key){const n=++request;$('orig').classList.toggle('active',key==='orig');$('opt').classList.toggle('active',key==='opt');$('info').textContent='Загрузка '+(key==='orig'?'оригинала…':'сжатой версии…');try{if(!cache[key]){let data;if(key==='orig'){const chunks=await Promise.all(Array.from({length:15},(_,i)=>fetch('original-'+i+'.b64').then(x=>{if(!x.ok)throw Error('HTTP '+x.status);return x.text()})));const str=atob(chunks.join('').trim());const arr=new Uint8Array(str.length);for(let i=0;i<str.length;i++)arr[i]=str.charCodeAt(i);data=arr.buffer;}else{const f=await fetch('optimized.glb');if(!f.ok)throw Error('HTTP '+f.status);data=await f.arrayBuffer();}const gltf=await loader.parseAsync(data,'');const g=gltf.scene;const b=new T.Box3().setFromObject(g),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3()),scale=1/Math.max(s.x,s.y,s.z);const pivot=new T.Group();pivot.add(g);pivot.scale.setScalar(scale);g.position.sub(c);let tris=0;g.traverse(o=>{if(o.isMesh)tris+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3});cache[key]={pivot,tris,bytes:data.byteLength};}if(n!==request)return;if(current)scene.remove(current);const obj=cache[key];current=obj.pivot;scene.add(current);$('info').textContent=(key==='orig'?'Оригинал':'Сжатая')+' · '+(obj.bytes/1e6).toFixed(2)+' МБ · '+Math.round(obj.tris)+' треугольников';}catch(e){if(n===request)$('info').textContent='Ошибка: '+e.message;}}
$('orig').onclick=()=>openModel('orig');$('opt').onclick=()=>openModel('opt');function zoom(k){const v=cam.position.clone().sub(orbit.target);v.setLength(T.MathUtils.clamp(v.length()*k,.25,8));cam.position.copy(orbit.target).add(v);orbit.update()}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});r.setAnimationLoop(()=>{orbit.update();r.render(scene,cam)});openModel('opt');
</script></body></html>
