</label><button id="lipPick">Выбрать верхнюю губу</button><label>Губа <input id="lipAmount" type="range" min="0" max=".006" step=".0005" value=".003"><output id="lipVal">0.003</output></label><button id="face">Лицо</button><button id="glassesToggle">Очки: вкл.</button><button id="front">Спереди</button><button id="side">Сбоку</button><button id="back">Сзади</button><button id="plus">＋</button><button id="minus">−</button><label>Высота <input id="gy" type="range" min="-.09" max=".09" step=".002" value="0"><output id="gyVal">0.000</output></label><label>Глубина <input id="gz" type="range" min="-.08" max=".08" step=".002" value="0"><output id="gzVal">0.000</output></label><label>Вбок <input id="gx" type="range" min="-.03" max=".03" step=".001" value="0"><output id="gxVal">0.000</output></label><label>Размер <input id="gs" type="range" min=".65" max="1.6" step=".025" value="0.925"><output id="gsVal">0.925</output></label></div><script type="module">

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.02,100),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf1f6ff,0x72634c,2.6));const light=new THREE.DirectionalLight(0xffecd7,3);light.position.set(3,6,4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);Object.assign(light.shadow.camera,{left:-4,right:4,top:4,bottom:-4});scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x728f78,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(20,40,0xc4c8a8,0x8da58b);grid.position.y=.001;scene.add(grid);

let model=null,bones=new Map(),rests=new Map(),axes=new Map(),phase=0,time=0,blend=0,wanted=0,forward=new THREE.Vector3(0,0,1),side=new THREE.Vector3(1,0,0),groundY=0,hipRest=null,hipUp=null,hipSide=null,modelScale=1;
const names=['Hips','Spine','Spine1','Spine2','Neck','Head','LeftArm','RightArm','LeftForeArm','RightForeArm','LeftUpLeg','RightUpLeg','LeftLeg','RightLeg','LeftFoot','RightFoot','LeftToeBase','RightToeBase'];

function pose(dt){if(!model)return;time+=dt;

}
let glasses=null,glassHead=null;const glassOffset=new THREE.Vector3();let glassSize=1;
function buildGlasses(){

 const root=new THREE.Group(),frame=new THREE.MeshStandardMaterial({color:0x292622,metalness:.35,roughness:.4}),lower=new THREE.MeshStandardMaterial({color:0x776653,metalness:.65,roughness:.32}),lens=new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.045,roughness:.12,depthWrite:false,side:THREE.DoubleSide});
 function tube(points,r=.00125,mat=frame){root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),40,r,8,false),mat))}
 for(const sign of [-1,1]){
 const cx=sign*.032,w=.026,h=.020;
 const shape=new THREE.Shape();
 const outline=[[ -1,.48],[-.94,.78],[-.64,.95],[.50,.95],[.87,.79],[1,.48],[.91,-.40],[.72,-.78],[.35,-.96],[-.35,-.96],[-.76,-.78],[-.95,-.35],[-1,.48]];
 const pts=outline.map(([x,y])=>new THREE.Vector3(cx+x*w,y*h,-.010*sign*x+.010*Math.pow(Math.max(0,-sign*x),2)));
 const curve=new THREE.CatmullRomCurve3(pts);
 const dense=curve.getPoints(80);
 dense.forEach((p,i)=>i?shape.lineTo(p.x,p.y):shape.moveTo(p.x,p.y));

 tube(pts.slice(0,6),.00145,frame);
 const m=new THREE.Mesh(new THREE.ShapeGeometry(shape),lens);m.position.z=-.001;root.add(m);
 tube([new THREE.Vector3(sign*.058,.009,-.010),new THREE.Vector3(sign*.068,.009,-.025),new THREE.Vector3(sign*.078,.006,-.105),new THREE.Vector3(sign*.079,.001,-.132),new THREE.Vector3(sign*.075,-.018,-.144)],.00145);
 }
 tube([new THREE.Vector3(-.006,.013,.020),new THREE.Vector3(0,.015,.023),new THREE.Vector3(.006,.013,.020)],.00145);
 // Determine face level from head and full-body proportions; sliders allow exact visual fitting.
 const pos=head.getWorldPosition(new THREE.Vector3()),top=new THREE.Box3().setFromObject(model).max.y;
 const eyeY=top-.126;const center=pos.clone();center.y=eyeY;center.addScaledVector(forward,.097);center.addScaledVector(new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),forward).normalize(),-.009);
 root.position.copy(center);const right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),forward).normalize();root.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right,new THREE.Vector3(0,1,0),forward));scene.add(root);head.attach(root);glasses=root;glassOffset.copy(root.position);glassSize=root.scale.x;
 updateGlasses();
}
function updateGlasses(){for(const n of ['gy','gz','gx','gs'])$(n+'Val').textContent=Number($(n).value).toFixed(3);if(!glasses)return;const inv=glassHead.getWorldQuaternion(new THREE.Quaternion()).invert(),scale=glassHead.getWorldScale(new THREE.Vector3()).y||1;glasses.position.copy(glassOffset).addScaledVector(new THREE.Vector3(0,1,0).applyQuaternion(inv),Number($('gy').value)/scale).addScaledVector(forward.clone().applyQuaternion(inv),Number($('gz').value)/scale).addScaledVector(side.clone().applyQuaternion(inv),Number($('gx').value)/scale);glasses.scale.setScalar(glassSize*Number($('gs').value));}
let lipParts=[],lipPick=false,lipRay=new THREE.Raycaster(),lipPointer=new THREE.Vector2();
function applyLip(){const amount=Number($('lipAmount').value);$('lipVal').textContent=amount.toFixed(3);for(const t of lipParts){for(const v of t.items){const k=v.i*3;t.p.setXYZ(v.i,t.orig[k]+v.d.x*amount*v.w,t.orig[k+1]+v.d.y*amount*v.w,t.orig[k+2]+v.d.z*amount*v.w)}t.p.needsUpdate=true}}
function selectLip(hit){for(const t of lipParts){t.p.array.set(t.orig);t.p.needsUpdate=true}lipParts=[];model.updateMatrixWorld(true);
 const o=hit.object,p=o.geometry.attributes.position,orig=new Float32Array(p.array),items=[],v=new THREE.Vector3(),d=new THREE.Vector3(),right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),forward).normalize(),inv=o.matrixWorld.clone().invert(),delta=new THREE.Vector3(0,-1,0).applyMatrix3(new THREE.Matrix3().setFromMatrix4(inv));
 for(let i=0;i<p.count;i++){o.getVertexPosition(i,v);o.localToWorld(v);d.copy(v).sub(hit.point);const x=d.dot(right),y=d.y,z=d.dot(forward);const q=(x/.030)**2+(y/.007)**2+(z/.013)**2;if(q>=1)continue;const w=(1-q)**2;if(w>.015)items.push({i,w,d:delta.clone()})}

}
function autoLip(){if(!model||!glasses)return;model.updateMatrixWorld(true);const p=glasses.getWorldPosition(new THREE.Vector3());p.y-=.048;p.addScaledVector(forward,.35);lipRay.set(p,forward.clone().negate());const hit=lipRay.intersectObject(model,true).find(x=>x.object.isSkinnedMesh);if(hit)selectLip(hit)}

let toothMode=false,toothEdits=new Map(),toothRay=new THREE.Raycaster();
function toothSurface(hit){
 const o=hit.object,m=Array.isArray(o.material)?o.material[hit.face.materialIndex]:o.material;if(!m?.map||!hit.uv)return null;
 if(!toothEdits.has(m)){const old=m.map,img=old.image,c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const tex=new THREE.CanvasTexture(c);tex.copy(old);tex.image=c;tex.needsUpdate=true;const orig=ctx.getImageData(0,0,c.width,c.height);toothEdits.set(m,{c,ctx,tex,old,orig});m.map=tex;m.needsUpdate=true}

function paintGum(hit,strength=.65){const s=toothSurface(hit);if(!s)return;const {t,x,y}=s,r=Math.max(2,Math.round(t.c.width*Number($('toothSize').value)/2048));const x0=Math.max(0,x-r),y0=Math.max(0,y-r),w=Math.min(t.c.width-x0,2*r+1),hh=Math.min(t.c.height-y0,2*r+1);const im=t.ctx.getImageData(x0,y0,w,hh),d=im.data;let count=0;
 for(let j=0;j<hh;j++)for(let i=0;i<w;i++){const q=Math.hypot(x0+i-x,y0+j-y)/r,k=(j*w+i)*4;if(q>=1)continue;const R=d[k],G=d[k+1],B=d[k+2];if(R<125||R-G<12||R-B<10)continue;const a=strength*Math.pow(1-q*q,2);d[k]=R+(239-R)*a;d[k+1]=G+(231-G)*a;d[k+2]=B+(219-B)*a;count++}

}
function autoTooth(){if(!model||!glasses)return;model.updateMatrixWorld(true);const base=glasses.getWorldPosition(new THREE.Vector3()),right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),forward).normalize();let hits=[];
 for(let yy=.055;yy<=.105;yy+=.002)for(let xx=-.031;xx<=-.006;xx+=.003){const p=base.clone().addScaledVector(right,xx).addScaledVector(forward,.35);p.y-=yy;toothRay.set(p,forward.clone().negate());const hit=toothRay.intersectObject(model,true).find(q=>q.object.isSkinnedMesh&&q.uv);if(!hit)continue;const s=toothSurface(hit);if(!s)continue;const {t,x,y}=s,k=(y*t.c.width+x)*4,d=t.orig.data;if(d[k]>180&&d[k+1]>155&&d[k+2]>140&&d[k]-d[k+1]<38&&d[k+1]-d[k+2]<30)hits.push({hit,yy,xx})}

 hits.sort((a,b)=>a.yy-b.yy);const top=hits[0];const p=base.clone().addScaledVector(right,top.xx).addScaledVector(forward,.35);p.y-=top.yy-.002;toothRay.set(p,forward.clone().negate());const hit=toothRay.intersectObject(model,true).find(q=>q.object.isSkinnedMesh&&q.uv);if(hit)paintGum(hit,.65);

renderer.domElement.addEventListener('pointerdown',e=>{if(!toothMode||!model)return;e.preventDefault();e.stopImmediatePropagation();const rect=renderer.domElement.getBoundingClientRect();toothRay.setFromCamera(new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),camera);model.updateMatrixWorld(true);const hit=toothRay.intersectObject(model,true).find(q=>q.object.isSkinnedMesh&&q.uv);if(hit)paintGum(hit);toothMode=false;controls.enabled=true;$('panel').hidden=false},true);

function view(n){controls.target.set(0,.88,0);const v=n==='side'?side.clone():forward.clone().multiplyScalar(n==='back'?-1:1);camera.position.copy(controls.target).addScaledVector(v,3.4).add(new THREE.Vector3(0,.3,0));controls.update()}
new GLTFLoader().load('../animations/owner-v2-rig-no-animations.glb',g=>{try{model=g.scene;scene.add(model);model.updateMatrixWorld(true);model.traverse(o=>{if(o.isBone){const n=o.name.split(':').pop().replace(/^mixamorig/,'');bones.set(n,o)}if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.isSkinnedMesh)o.frustumCulled=false}});const l=bones.get('LeftArm'),r=bones.get('RightArm');if(l&&r){side.copy(l.getWorldPosition(new THREE.Vector3()).sub(r.getWorldPosition(new THREE.Vector3())));side.y=0;side.normalize();forward.crossVectors(side,new THREE.Vector3(0,1,0)).normalize();const hf=bones.get('headfront'),head=bones.get('Head');if(hf&&head&&hf.getWorldPosition(new THREE.Vector3()).sub(head.getWorldPosition(new THREE.Vector3())).dot(forward)<0)forward.negate()}

const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());model.scale.setScalar(1.75/size.y);model.updateMatrixWorld(true);box.setFromObject(model);const center=box.getCenter(new THREE.Vector3());model.position.set(-center.x,-box.min.y,-center.z);groundY=model.position.y;model.updateMatrixWorld(true);const hips=bones.get('Hips');if(hips){hipRest=hips.position.clone();const inv=hips.parent.getWorldQuaternion(new THREE.Quaternion()).invert();hipUp=new THREE.Vector3(0,1,0).applyQuaternion(inv);hipSide=lateral.clone().applyQuaternion(inv);modelScale=hips.parent.getWorldScale(new THREE.Vector3()).y||1}
buildGlasses();autoLip();try{autoTooth()}catch(e){$('toothInfo').textContent='Десна: '+e.message}controls.target.set(0,.88,0);view('front');$('status').textContent='Скелет: '+bones.size+' · покой';}catch(e){$('status').textContent='Ошибка: '+e.message}},undefined,e=>$('status').textContent='Ошибка загрузки GLB');
$('lipAmount').oninput=applyLip;$('lipPick').onclick=()=>{lipPick=true;controls.enabled=false;$('panel').hidden=true;$('lipInfo').textContent='Нажми на центр верхней губы'};$('toothPick').onclick=()=>{toothMode=true;lipPick=false;controls.enabled=false;$('panel').hidden=true;$('toothInfo').textContent='Нажми на розовый участок над зубом'};$('toothReset').onclick=()=>{for(const t of toothEdits.values()){t.ctx.putImageData(t.orig,0,0);t.tex.needsUpdate=true}$('toothInfo').textContent='Десна: исходная'};$('idle').onclick=()=>{wanted=0;$('status').textContent='Покой'};$('face').onclick=()=>{if(!model)return;controls.target.copy(bones.get('Head').getWorldPosition(new THREE.Vector3()));controls.target.y+=.08;camera.position.copy(controls.target).addScaledVector(forward,.85);controls.update()};$('glassesToggle').onclick=()=>{if(glasses){glasses.visible=!glasses.visible;$('glassesToggle').textContent=glasses.visible?'Очки: вкл.':'Очки: выкл.'}};for(const n of ['gy','gz','gx','gs'])$(n).oninput=updateGlasses;for(const n of ['front','side','back'])$(n).onclick=()=>view(n);function zoom(f){const d=camera.position.clone().sub(controls.target);d.setLength(THREE.MathUtils.clamp(d.length()*f,.8,10));camera.position.copy(controls.target).add(d);controls.update()}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('toggle').onclick=()=>{$('panel').hidden=!$('panel').hidden;$('toggle').textContent=$('panel').hidden?'◇':'◆'};
const clock=new THREE.Clock();let frames=0,elapsed=0;function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();frames++;elapsed+=dt;if(elapsed>.6){$('fps').textContent='FPS '+Math.round(frames/elapsed);frames=0;elapsed=0}pose(Math.min(dt,.05));controls.update();renderer.render(scene,camera)}animate();
