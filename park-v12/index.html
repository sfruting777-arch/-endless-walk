 else if(fetchState==='pickup'){const p=dog.mouth();if(p&&ft>=.60){const w=T.MathUtils.smoothstep(ft,.60,.85);stick.position.copy(landing).lerp(p.clone().add(new T.Vector3(0,-.008,0)),w);stick.rotation.set(0,fetchHeading,0);}if(ft>=1.45)transition('return');}
 else if(fetchState==='return'||fetchState==='give'){const p=dog.mouth();if(p){stick.position.copy(p).add(new T.Vector3(0,-.008,0));stick.rotation.set(0,fetchHeading,0);}if(fetchState==='give'&&ft>=1){transition('reset');}}
 else if(fetchState==='reset'){carryAt(handPos(),heading);}
 if(followPair){const center=john.root.position.clone().add(new T.Vector3(0,.85,0));const delta=center.clone().sub(orbit.target);orbit.target.copy(center);cam.position.add(delta);}
 const ok=john.ready()&&dog.ready();$('pairStatus').textContent=ok?'John 1,75 м · пёс 0,70 м':'John: '+john.status()+' · пёс: '+dog.status();
 if(stickReady)$('stickStatus').textContent=({windup:'Джон готовится',throw:'Бросок',flight:'Палка летит',chase:'Пёс бежит за палкой',pickup:'Подбирает палку',return:'Несёт обратно',give:'Принёс!',reset:'Возвращается к прогулке'})[fetchState]||'Ветка · 40 см · 0,58 МБ';
}
$('pair').onclick=()=>{manualView=true;clearJoy();cam.fov=48;cam.updateProjectionMatrix();stickClose=false;orbit.minDistance=1;firstPerson=false;walking=false;orbit.enabled=true;followPair=true;orbit.target.copy(playerPos).add(new T.Vector3(0,.95,0));cam.position.copy(orbit.target).add(new T.Vector3(-Math.sin(playerHeading)*3.4,1.35,-Math.cos(playerHeading)*3.4));orbit.update();syncButton();};
$('stickView').onclick=()=>{if(!stickReady||fetchState!=='idle')return;pairMoving=false;manualView=false;clearJoy();$('pairWalk').textContent='Гулять вместе';firstPerson=false;walking=false;followPair=false;stickClose=true;orbit.enabled=true;orbit.minDistance=.18;stick.updateMatrixWorld(true);const target=new T.Box3().setFromObject(stick,true).getCenter(new T.Vector3());orbit.target.copy(target);cam.position.copy(target).add(new T.Vector3(.38,.38,.52));orbit.update();syncButton();};
$('pairWalk').onclick=()=>{if(fetchState!=='idle')return;pairMoving=!pairMoving;$('pairWalk').textContent=pairMoving?'Стоп ребята':'Гулять вместе';syncButton();};

$('pair').onclick();
const clock=new T.Clock();let elapsed=0,frames=0;function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();elapsed+=dt;frames++;if(elapsed>.6){$('fps').textContent='FPS '+Math.round(frames/elapsed);elapsed=0;frames=0}pairTick(Math.min(dt,.05));if(firstPerson){updateEye();}else orbit.update();r.render(scene,cam)}animate();
</script></body></html>
